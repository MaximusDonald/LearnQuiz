services:
  # Web Service Backend (FastAPI)
  - type: web
    name: learnquiz-backend
    env: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: learnquiz-db
          property: connectionString
      - key: FRONTEND_URL
        value: "https://learnquiz-frontend.onrender.com"
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: "HS256"
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440" # 24h for standard usage

  # Static Site Frontend (React / Vite)
  - type: web
    name: learnquiz-frontend
    env: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: "./dist"
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: learnquiz-backend
          property: url
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  # Base de données gérée par Render
  - name: learnquiz-db
    databaseName: learnquiz
    user: learnquiz_user
    plan: free
